[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whiteboard-shorts-backend"
version = "0.1.0"
description = "FastAPI 서버: 영상 생성 요청 수신, 파이프라인 실행, 작업 상태·결과 제공"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "whiteboard-shorts-pipeline",
]

[tool.uv.sources]
whiteboard-shorts-pipeline = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]
