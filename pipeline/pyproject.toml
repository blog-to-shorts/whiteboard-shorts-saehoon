[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whiteboard-shorts-pipeline"
version = "0.1.0"
description = "블로그 → 대본 → 화이트보드 이미지 → TTS·자막 → 드로잉 → 9:16 영상 파이프라인 (STEP 01~08) + 품질 평가"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "openai>=1.40",
    "httpx>=0.27",
    "edge-tts>=7.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
# STEP 06 드로잉 엔진 (MIT). 설치: uv sync --extra animator  — 없으면 단순 스윕 드로잉으로 대체
animator = ["whiteboard-animator>=0.1.1"]

[project.scripts]
wbs = "pipeline.run:main"
wbs-eval = "pipeline.eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"src/pipeline/prompts" = "pipeline/prompts"
